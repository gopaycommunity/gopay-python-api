# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Smoke test on Windows with the minimum supported Python
          # (setup-python provides 3.9.13, the last 3.9 release with Windows binaries)
          - os: windows-latest
            python-version: "3.9"
    defaults:
      run:
        # snok/install-poetry requires bash on Windows
        shell: bash

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Lint with Ruff
        run: poetry run ruff check --output-format=github .
      - name: Check formatting with Ruff
        run: poetry run ruff format --check --diff .
      - name: Type check with Pyright
        run: poetry run pyright
      - name: Test with pytest
        run: |
          poetry run pytest tests/ --log-cli-level=WARN
