[project]
name = "gopay"
version = "2.3.1"
description = "GoPay's Python SDK for Payments REST API"
readme = "README.md"
license = "MIT"
authors = [{name = "GoPay", email = "integrace@gopay.cz"}]
keywords = ["gopay", "payments", "sdk", "rest", "api"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9,<4.0"
dependencies = [
  "deprecated>=1.2.14,<2.0.0",
  "pydantic>=2.8.2,<3.0.0",
  "requests>=2.31.0,<3.0.0",
  "tomli>=2.0.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/gopaycommunity/gopay-python-api"
Repository = "https://github.com/gopaycommunity/gopay-python-api"
Documentation = "https://doc.gopay.com"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{include = "gopay"}]

[tool.poetry.group.dev.dependencies]
deprecated = "^1.2.14"
pytest = "^8.3.3"
pytest-coverage = "^0.0"
pytest-dotenv = "^0.5.2"
pyright = {version = "^1.1.408", extras = ["nodejs"]}
ruff = "~0.17.3"
types-requests = "^2.31.0"
types-deprecated = "^1.2.9"
pre-commit = "^4.0"

[tool.pytest.ini_options]
addopts = [
  "--log-cli-level=INFO",
  "--cov=gopay",
]
env_files = [
  "tests/.sandbox.env",
]

[tool.ruff]
# target-version is inferred from `requires-python` in [project].
line-length = 88
# Python sources only (Ruff would otherwise also format code blocks in Markdown).
include = ["gopay/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.pyupgrade]
# Pydantic evaluates annotations at runtime; `X | None` breaks on Python 3.9.
keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["gopay"]

[tool.pyright]
include = ["gopay", "tests", "examples"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
strict = ["gopay"]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]
