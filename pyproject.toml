[tool.poetry]
authors = ["GoPay <integrace@gopay.cz>"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
description = "GoPay's Python SDK for Payments REST API"
documentation = "https://doc.gopay.com"
homepage = "https://github.com/gopaycommunity/gopay-python-api"
keywords = ["gopay", "payments", "sdk", "rest", "api"]
license = "MIT"
name = "gopay"
packages = [{include = "gopay"}]
readme = "README.md"
repository = "https://github.com/gopaycommunity/gopay-python-api"
version = "2.3.1"

[tool.poetry.dependencies]
deprecated = "^1.2.14"
pydantic = "^2.8.2"
python = "^3.9"
requests = "^2.31.0"
tomli = "^2.0.1"

[tool.poetry.group.dev.dependencies]
deprecated = "^1.2.14"
pytest = "^8.3.3"
pytest-coverage = "^0.0"
pytest-dotenv = "^0.5.2"
pyright = {version = "^1.1.408", extras = ["nodejs"]}
ruff = "~0.17.3"
types-requests = "^2.31.0"
types-deprecated = "^1.2.9"

[tool.pytest.ini_options]
addopts = [
  "--log-cli-level=INFO",
  "--cov=gopay",
]
env_files = [
  "tests/.sandbox.env",
]

[tool.ruff]
# No [project] table (Poetry-only metadata), so Ruff can't infer this.
# Keep in sync with `python` in [tool.poetry.dependencies].
target-version = "py39"
line-length = 88
# Python sources only (Ruff would otherwise also format code blocks in Markdown).
include = ["gopay/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.pyupgrade]
# Pydantic evaluates annotations at runtime; `X | None` breaks on Python 3.9.
keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["gopay"]

[tool.pyright]
include = ["gopay", "tests", "examples"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
strict = ["gopay"]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]
